<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Input Lab</title>
<!--
  PYTHON INPUT LAB – Grade 8 Work Education
  Topic: Taking Input from the User in Python (input() function)
  Sharjah Indian School, Juwaiza – Department of Computer Science

  SETUP:
  1. SHEET_URL – the Web App URL from your Google Apps Script deployment (already filled in).
  2. The PINs are NOT kept in this file. Set them in the "Settings" tab of your Google Sheet
     (Start PIN and Teacher PIN) – you can change them for every class.
-->
<style>
  :root{
    --bg:#f2f6f7; --card:#fff; --ink:#1b2a33; --muted:#5b6b75; --line:#d6e1e4;
    --teal:#0f5c63; --teal-soft:#e2f1f2; --amber:#f2b531; --amber-soft:#fff6d9;
    --green:#2e9d5b; --green-soft:#e5f5eb; --red:#c4473f; --red-soft:#fbeaea;
    --shell:#1d2329; --shell-ink:#e6edf3; --prompt:#8fd3ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--teal);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:21px}
  header small{opacity:.85;font-size:13px}
  .who{display:flex;align-items:center;gap:10px;font-size:14px}
  .pts{background:var(--amber);color:#3b2a00;font-weight:700;padding:5px 12px;border-radius:20px}
  .out{background:transparent;color:#fff;border:1px solid #fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
  .steps{display:flex;gap:4px;justify-content:center;padding:10px 12px 0;flex-wrap:wrap}
  .st{font-size:12px;padding:4px 10px;border-radius:12px;background:#e3e9eb;color:var(--muted)}
  .st.on{background:var(--teal);color:#fff}.st.done{background:var(--green);color:#fff}
  main{max-width:900px;margin:18px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
  h2{margin:0 0 8px;font-size:20px;color:var(--teal)}
  .tag{display:inline-block;font-size:12px;font-weight:700;background:var(--teal-soft);color:var(--teal);padding:3px 10px;border-radius:12px;margin-bottom:8px}
  label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}
  input[type=text],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-family:inherit}
  .row{display:flex;gap:12px}.row>div{flex:1}
  .btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;margin:12px 8px 0 0}
  .btn.alt{background:#fff;color:var(--teal);border:1px solid var(--teal)}
  .btn:disabled{opacity:.45;cursor:default}
  code,.mono{font-family:Consolas,"Courier New",monospace}
  pre{background:var(--shell);color:var(--shell-ink);padding:12px;border-radius:8px;overflow-x:auto;font-size:14px;margin:8px 0;line-height:1.5}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;cursor:pointer;font-size:15px;font-family:inherit}
  .opt:hover:not(:disabled){border-color:var(--teal)}
  .opt.right{border-color:var(--green);background:var(--green-soft)}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .msg{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:15px;line-height:1.45}
  .ok{background:var(--green-soft);color:#1d6b3d}.bad{background:var(--red-soft);color:#8a2b25}.info{background:var(--teal-soft);color:#0d4a50}
  .hint{font-size:14px;color:var(--teal);cursor:pointer;text-decoration:underline;display:inline-block;margin-top:10px}
  .center{text-align:center}
  .badge{font-size:64px}
  .hidden{display:none}

  /* simulator */
  .sim{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
  .panel-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .codeline{background:#fbfcfd;border:2px solid var(--amber);border-radius:8px;padding:12px;font-family:Consolas,monospace;font-size:16px;word-break:break-word}
  .codeline .fn{color:#7b3fbf;font-weight:700}.codeline .q{color:#1b7f3b}
  .shell{background:var(--shell);color:var(--shell-ink);border-radius:8px;padding:12px;font-family:Consolas,monospace;font-size:16px;min-height:110px;white-space:pre-wrap}
  .shell .p{color:var(--prompt)}
  .shell .err{color:#ff8a80}
  .shell input{background:transparent;border:0;border-bottom:1px dashed #8fd3ff;color:#fff;font-family:Consolas,monospace;font-size:16px;width:170px;outline:none;padding:0}
  .cursor{display:inline-block;width:9px;background:#e6edf3;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .flow{display:flex;flex-direction:column;gap:8px}
  .fs{display:flex;align-items:center;gap:12px;border:2px solid var(--line);border-radius:10px;padding:12px;background:#fff;transition:all .3s;opacity:.5}
  .fs .ic{font-size:30px;width:40px;text-align:center}
  .fs b{display:block;font-size:15px}
  .fs span{font-size:13px;color:var(--muted)}
  .fs.on{opacity:1;border-color:var(--amber);background:var(--amber-soft);transform:scale(1.02)}
  .fs.did{opacity:1;border-color:var(--green)}
  .fs.off{opacity:.25}
  .arrow{text-align:center;color:var(--muted);font-size:18px;line-height:1}
  .note{min-height:50px;font-size:16px}
  .dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#d0dadd}.dots i.on{background:var(--teal)}
  .lvchips{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}

  /* python editor */
  .ide{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
  .edwrap{display:flex;border:2px solid #c9d6da;border-radius:8px;overflow:hidden;background:#fff;height:200px}
  .edwrap:focus-within{border-color:var(--teal)}
  .gutter{background:#eef3f4;color:#8a98a1;font-family:Consolas,monospace;font-size:15px;line-height:22px;padding:10px 6px;text-align:right;min-width:34px;overflow:hidden;user-select:none;white-space:pre}
  .ed{flex:1;border:0;outline:none;resize:none;font-family:Consolas,"Courier New",monospace;font-size:15px;line-height:22px;padding:10px;white-space:pre;overflow:auto;tab-size:4;color:#1b2a33}
  .ide .shell{height:190px;overflow:auto;min-height:0}
  .shell .ok-line{color:#9be29b}
  .rules{list-style:none;padding:0;margin:10px 0 0}
  .rules li{padding:6px 10px;border-radius:6px;margin:4px 0;font-size:15px;background:#f3f6f7;color:var(--muted)}
  .rules li.pass{background:var(--green-soft);color:#1d6b3d;font-weight:600}
  .rules li.fail{background:var(--red-soft);color:#8a2b25}
  @media (max-width:720px){.ide{grid-template-columns:1fr}}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:6px 0 28px}
  /* learning objective + success criteria panel */
  #losc{max-width:900px;margin:12px auto 0;padding:0 16px}
  .losc{display:grid;grid-template-columns:1fr 1.35fr;gap:0;background:#fff;border:2px solid var(--teal);border-radius:12px;overflow:hidden}
  .losc .walt b{color:var(--amber)}
  .losc .walt{background:var(--teal);color:#fff;padding:12px 14px;font-size:14px;line-height:1.45}
  .losc .walt .h{display:block;font-weight:700;font-size:12px;letter-spacing:.05em;color:var(--amber);margin-bottom:4px}
  .losc .wilf{padding:10px 14px;font-size:14px}
  .losc .wilf>b{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.05em;color:var(--teal);margin-bottom:4px}
  .losc .wilf>b span{color:var(--muted);letter-spacing:0;font-weight:600}
  .sc{display:flex;gap:8px;align-items:flex-start;padding:3px 0;color:var(--muted)}
  .sc i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid #b9c7cb;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none;margin-top:1px}
  .sc.met{color:#1d6b3d;font-weight:600}.sc.met i{background:var(--green);border-color:var(--green);color:#fff}
  .sc.all{color:#1d6b3d}
  @media (max-width:720px){.sim{grid-template-columns:1fr}.row{flex-direction:column;gap:0}.losc{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <div>
    <h1>🐍 Python Input Lab</h1>
    <small>Grade 8 · Taking Input from the User · input()</small>
  </div>
  <div class="who hidden" id="who">
    <span id="whoName"></span>
    <span class="pts" id="pts">0 pts</span>
    <button class="out" onclick="signOut()">Sign out</button>
  </div>
</header>
<div class="steps hidden" id="steps"></div>
<div id="losc" class="hidden"></div>
<main id="app"></main>
<footer>Sharjah Indian School, Juwaiza · Department of Computer Science · Educate ❖ Enlighten ❖ Empower</footer>

<!-- Skulpt: runs Python inside the web page (no Python installation needed) -->
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
<script>
/* ================= SETTINGS ================= */
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzqrNHPz7pAqgZodH5BsSCSyjj34PnWVY9pZPNULPBmph88gCNY66FD44hxLoWbsx4K/exec";
const GRADES    = ["VIII", "VII", "VI"];   // first one is selected by default
// Only used for testing when SHEET_URL is empty. With SHEET_URL set, PINs come from the Google Sheet.
const TEST_START_PIN   = "";
const TEST_TEACHER_PIN = "";

/* ================= CONTENT ================= */
const STARTER = [
  { q: "A Dubai Metro kiosk shows <b>“Welcome, Visitor!”</b> to everyone. What does it need so that it can greet each traveller by their own name?",
    opts: ["A bigger screen", "A way to ask the traveller to type their name", "A louder speaker"], a: 1 },
  { q: "Which of these asks <b>you</b> to type something before it can work?",
    opts: ["A wall clock", "An ATM asking for your PIN", "A road sign"], a: 1 }
];
const PLENARY = [
  { q: "What does the <code>input()</code> function do?",
    opts: ["It only shows a message on the screen", "It shows a question and waits for the user to type an answer", "It deletes what the user typed"], a: 1 },
  { q: "Which line is written correctly?",
    opts: ["<code>input(What is your name?)</code>", "<code>input(\"What is your name? \")</code>", "<code>Input(\"What is your name? \")</code>"], a: 1 }
];
const HOT_Q = "Why should we always write a clear question inside input(), like input(\"What is your name? \")? What could happen if there was no question?";

/* Simulator – each step is ONE line of code */
const SIM = [
  { code: 'input("What is your name? ")', prompt: "What is your name? ", typed: "Aisha", out: null,
    note: "<b>input()</b> shows the question and then <b>waits</b>. The user types an answer and presses <b>Enter</b>." },
  { code: 'print("Hello", input("What is your name? "))', prompt: "What is your name? ", typed: "Aisha", out: "Hello Aisha",
    note: "Put <b>input()</b> inside <b>print()</b>. Python asks the question first, then prints <b>Hello</b> with the answer." },
  { code: 'print("You live in", input("Which emirate do you live in? "))', prompt: "Which emirate do you live in? ", typed: "Sharjah", out: "You live in Sharjah",
    note: "A different question – the same idea. The answer is printed after the message." },
  { code: 'print(input("Your favourite UAE food? "), "is delicious!")', prompt: "Your favourite UAE food? ", typed: "Luqaimat", out: "Luqaimat is delicious!",
    note: "The answer can also come <b>first</b>. 🎉 Well done – click <b>Continue</b> to try it yourself!" }
];

/* Levels – written and run in the website's Python editor and checked automatically.
   r = result of the run: { ok, error, code, prompts[], answers[], printed[] } */
const has = (lines, txt) => lines.some(l => l.toLowerCase().includes(String(txt).toLowerCase()));
const LEVELS = [
  { title: "Level 1 – Hello Bot 👋",
    task: "Write a program that asks the user's <b>name</b> and prints <b>Hello</b> with the name.",
    sample: "What is your name? Omar\nHello Omar",
    start: "# Level 1 – write your program below\n",
    hint: "Put input() inside print(), after the word \"Hello\" and a comma.",
    rules: [
      ["Asks a question using input()", r => r.prompts.length >= 1],
      ["Prints Hello with the name the user typed", r => r.answers.length >= 1 && r.printed.some(l => /hello/i.test(l) && l.includes(r.answers[0]))],
      ["Runs without errors", r => r.ok]
    ] },
  { title: "Level 2 – My UAE Questions 🇦🇪",
    task: "Write a program that asks <b>2 questions</b> and prints each answer with a message:<br>• your favourite emirate &nbsp;• your favourite UAE landmark",
    sample: "Your favourite emirate? Fujairah\nMy favourite emirate is Fujairah\nYour favourite UAE landmark? Burj Khalifa\nI love Burj Khalifa",
    start: "# Level 2 – write your program below\n",
    hint: "Write 2 lines – each one is a print() with a message and an input() inside it.",
    rules: [
      ["Asks 2 questions using input()", r => r.prompts.length >= 2],
      ["Prints every answer with a message", r => r.answers.length >= 2 && r.answers.every(a => r.printed.some(l => l.includes(a) && l.trim() !== a.trim()))],
      ["Runs without errors", r => r.ok]
    ] },
  { title: "Level 3 – Bug Hunt 🐞",
    task: "This program has <b>2 bugs</b>. Fix them in the editor so that the program runs correctly.",
    sample: "What is your name? Mariam\nHello Mariam\nYour favourite colour? Blue\nBlue",
    start: 'print("Hello", input(What is your name? ))\nPrint(input("Your favourite colour? "))\n',
    hint: "Look for: a question with no quotes, and a capital letter that should be small.",
    rules: [
      ["Both bugs fixed – the program runs without errors", r => r.ok && r.prompts.length >= 2],
      ["Prints Hello with the name", r => r.answers.length >= 1 && r.printed.some(l => /hello/i.test(l) && l.includes(r.answers[0]))],
      ["Prints the favourite colour", r => r.answers.length >= 2 && has(r.printed, r.answers[1])]
    ] },
  { title: "Level 4 (optional) – Metro Ticket Kiosk 🚇",
    task: "Make a Dubai Metro kiosk that asks the traveller's <b>name</b> and <b>destination station</b>, and prints a ticket with a line of <b>=</b> signs at the top and bottom.",
    sample: "==============================\nWhat is your name? Fatima\nPassenger: Fatima\nWhere are you going? Mall of the Emirates\nGoing to: Mall of the Emirates\nHave a safe journey!\n==============================",
    start: "# Level 4 – write your program below\n",
    hint: "Use print() for the = lines and the last message. Use print() with input() inside for the name and station.",
    rules: [
      ["Prints a line of = signs at the top and bottom", r => r.printed.filter(l => /={5,}/.test(l)).length >= 2],
      ["Asks for the name and the station using input()", r => r.prompts.length >= 2],
      ["Shows both answers on the ticket", r => r.answers.length >= 2 && r.answers.slice(0, 2).every(a => r.printed.some(l => l.includes(a) && l.trim() !== a.trim()))],
      ["Runs without errors", r => r.ok]
    ] }
];

const STAGES = [["starter","Starter"],["gate","🔒 PIN"],["sim","Simulator"],["missions","Try it"],["levels","Levels"],["check","Teacher Check"],["plenary","Plenary"],["done","Badge"]];

/* ================= STATE ================= */
let S = load();
function fresh(u){
  return { ...u, date: today(), stage: "starter", sq: 0, s: [null, null], simDone: false,
    m: 0, lv: [false, false, false, false], code: [null, null, null, null], cur: 0, approved: false, pq: 0, p: [null, null], hot: "", points: 0 };
}
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function save(){ try{ localStorage.setItem("pil8", JSON.stringify(S)); }catch(e){} }
function load(){ try{ return JSON.parse(localStorage.getItem("pil8")); }catch(e){ return null; } }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])); }
const L = i => String.fromCharCode(65 + i);
const $ = id => document.getElementById(id);
const app = $("app");

function status(){
  if(S.stage === "done") return "Completed";
  if(S.approved) return "Approved";
  if(S.lv[2]) return "Waiting";
  return "In progress";
}
function badge(){ return S.lv[3] ? "Input Master" : "Input Explorer"; }
function sync(){
  if(!SHEET_URL || !S) return;
  const body = {
    date: S.date, cls: S.cls, div: S.div, name: S.name,
    s1: S.s[0] == null ? "" : L(S.s[0]), s2: S.s[1] == null ? "" : L(S.s[1]),
    sim: S.simDone ? "Watched" : "", missions: S.m,
    l1: S.lv[0], l2: S.lv[1], l3: S.lv[2], l4: S.lv[3],
    check: status(), p1: S.p[0] == null ? "" : L(S.p[0]), p2: S.p[1] == null ? "" : L(S.p[1]),
    hot: S.hot, points: S.points, badge: S.stage === "done" ? badge() : "",
    programs: (S.code || []).map((c, i) => c ? `### Level ${i + 1}${S.lv[i] ? " ✔" : ""}\n${c.trim()}` : "").filter(Boolean).join("\n\n").slice(0, 40000)
  };
  try{ fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }); }catch(e){}
}
function commit(){ save(); sync(); drawTop(); }
function addPts(n){ S.points += n; }

/* Learning Objective (WALT) and Success Criteria (WILF) – shown on every page after the Starter.
   Each criterion is ticked automatically when the student has shown it on the website. */
const WALT = "use the <b>input()</b> function in Python to ask the user questions and display the answers.";
const WILF = [
  ["I can <b>explain</b> what input() does – it shows a question and waits for the user to type.",
   () => S.simDone && S.m >= 3],                       // simulator + Mission 3 (what comes first)
  ["I can <b>write</b> input() with a clear question inside quotes.",
   () => S.m >= 1 && S.lv[0]],                         // Mission 1 + Level 1 passed
  ["I can <b>use</b> input() inside print() to display a message with the answer.",
   () => S.m >= 2 && S.lv[0] && S.lv[1] && S.lv[2]]    // Mission 2 + Levels 1–3 passed
];
function drawLOSC(){
  const box = $("losc");
  if(!S || S.stage === "starter"){ box.classList.add("hidden"); return; }
  box.classList.remove("hidden");
  const met = WILF.map(w => { try{ return !!w[1](); }catch(e){ return false; } });
  const n = met.filter(Boolean).length;
  box.innerHTML = `<div class="losc">
    <div class="walt"><span class="h">🎯 LEARNING OBJECTIVE (WALT)</span>We are learning to ${WALT}</div>
    <div class="wilf"><b>✅ SUCCESS CRITERIA (WILF) <span>${n === 3 ? "🎉 All 3 met!" : n + " of 3 met"}</span></b>
      ${WILF.map((w, k) => `<div class="sc ${met[k] ? "met" : ""}"><i>${met[k] ? "✔" : k + 1}</i><div>${w[0]}</div></div>`).join("")}
    </div>
  </div>`;
}

function drawTop(){
  drawLOSC();
  if(!S){ $("who").classList.add("hidden"); $("steps").classList.add("hidden"); return; }
  $("who").classList.remove("hidden"); $("steps").classList.remove("hidden");
  $("whoName").textContent = `${S.name} · ${S.cls}-${S.div}`;
  $("pts").textContent = S.points + " pts";
  const idx = STAGES.findIndex(s => s[0] === S.stage);
  $("steps").innerHTML = STAGES.map((s, i) => {
    const cls = i < idx ? "done" : i === idx ? "on" : "";
    if(s[0] === "sim" && S.simDone && S.stage !== "sim")   // students can go back to the simulator
      return `<button class="st ${reviewing ? "on" : cls}" style="border:0;cursor:pointer" title="See the simulator again" onclick="openSim()">🔍 ${s[1]}</button>`;
    return `<span class="st ${reviewing ? (i < idx || i === idx ? "done" : "") : cls}">${s[1]}</span>`;
  }).join("");
}
function go(stage){ S.stage = stage; commit(); render(); window.scrollTo(0, 0); }

let reviewing = false;   // true while a student is looking back at the simulator
function openSim(){ reviewing = true; drawTop(); sim(); window.scrollTo(0, 0); }
function backFromSim(){ reviewing = false; render(); window.scrollTo(0, 0); }
const simLink = () => S.simDone ? `<span class="hint" style="margin-left:14px" onclick="openSim()">🔍 See the simulator examples again</span>` : "";

function render(){
  reviewing = false;
  drawTop();
  if(!S) return login();
  ({ starter: () => quiz("starter"), gate, sim, missions, levels, check, plenary: () => S.pq < 2 ? quiz("plenary") : hot(), done })[S.stage]();
}

/* ================= PIN HELPERS ================= */
async function pinOK(kind, pin){
  pin = String(pin).trim();
  if(!pin) return false;
  if(!SHEET_URL) return pin === (kind === "start" ? TEST_START_PIN : TEST_TEACHER_PIN) && pin !== "";
  const r = await fetch(SHEET_URL + "?check=" + kind + "&pin=" + encodeURIComponent(pin), { cache: "no-store" });
  const j = await r.json();
  return j.ok === true;
}
/* not a password field, so browsers will not offer to save or autofill it */
function pinBox(id){
  return `<input type="text" id="${id}" name="p${Math.random().toString(36).slice(2)}" inputmode="numeric"
    autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-form-type="other"
    style="-webkit-text-security:disc;letter-spacing:3px">`;
}
async function checkPinUI(kind, inputId, btnId, onOK, badMsg){
  const inp = $(inputId), btn = $(btnId), pin = inp.value;
  inp.value = "";
  btn.disabled = true; $("m").innerHTML = `<div class="msg info">Checking PIN…</div>`;
  try{
    if(await pinOK(kind, pin)) return onOK();
    $("m").innerHTML = `<div class="msg bad">${badMsg}</div>`;
  }catch(e){
    $("m").innerHTML = `<div class="msg bad">Could not check the PIN – please check the internet connection and try again.</div>`;
  }
  btn.disabled = false; inp.focus();
}

/* ================= LOGIN ================= */
function login(){

/* ================= QUIZ (starter + plenary) ================= */
function quiz(kind){
  const list = kind === "starter" ? STARTER : PLENARY;
  const i = kind === "starter" ? S.sq : S.pq;
  const it = list[i];
  app.innerHTML = `
  <div class="card">
    <span class="tag">${kind === "starter" ? "Starter" : "Plenary"} · Question ${i + 1} of ${list.length}</span>
    <h2>${kind === "starter" ? "Warm-up 🔥" : "Check your learning 🏁"}</h2>
    <div>${it.q}</div>
    <div>${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${L(k)}. ${o}</button>`).join("")}</div>
    <div id="m"></div>
  </div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const k = +b.dataset.k, right = k === it.a;
    app.querySelectorAll(".opt").forEach(x => x.disabled = true);
    b.classList.add(right ? "right" : "wrong");
    if(!right) app.querySelector(`.opt[data-k="${it.a}"]`).classList.add("right");
    if(right) addPts(10);
    if(kind === "starter"){ S.s[i] = k; S.sq++; } else { S.p[i] = k; S.pq++; }
    commit();
    $("m").innerHTML = `<div class="msg ${right ? "ok" : "bad"}">${right ? "Correct! +10 points" : "Not quite – the correct answer is shown in green."}</div>
      <button class="btn" id="nx">Next ▶</button>`;
    $("nx").onclick = () => {
      if(kind === "starter" && S.sq >= STARTER.length) return go("gate");
      render();
    };
  });
}

/* ================= SIMPLE HELPERS ================= */
function colour(code){   // light colouring: function names purple, text in quotes green
  return esc(code).replace(/(&quot;.*?&quot;)/g, '<span class="q">$1</span>').replace(/\b(print|input)\b/g, '<span class="fn">$1</span>');
}
function shellLine(sh, html){ const d = document.createElement("div"); d.innerHTML = html; sh.appendChild(d); return d; }
function flowHTML(id){
  return `<div class="flow" id="${id}">
    <div class="fs" data-s="0"><div class="ic">💬</div><div><b>1. Shows the question</b><span>input() writes the question in the Shell</span></div></div>
    <div class="arrow">⬇</div>
    <div class="fs" data-s="1"><div class="ic">⌨️</div><div><b>2. Waits for you to type</b><span>The program stops until you press Enter</span></div></div>
    <div class="arrow">⬇</div>
    <div class="fs" data-s="2"><div class="ic">🖨️</div><div><b>3. Shows the answer</b><span>print() displays the message with your answer</span></div></div>
  </div>`;
}
function flowSet(id, active, hasPrint){
  document.querySelectorAll(`#${id} .fs`).forEach(f => {
    const s = +f.dataset.s;
    f.className = "fs" + (s === 2 && !hasPrint ? " off" : s < active ? " did" : s === active ? " on" : "");
  });
}

/* ================= SIMULATOR ================= */
let simI = 0, busy = false, simTok = 0;
function sim(){
  simI = 0; busy = false;
  const back = reviewing || S.stage !== "sim";
  app.innerHTML = `
  <div class="card">
    <span class="tag">${back ? "Looking back · Simulator" : "Main Activity · Explore"}</span>
    <h2>How does input() work? 🤔</h2>
    <p style="margin-top:0">Click <b>▶ Run</b> and watch the 3 steps.${S.simDone ? " Click an <b>Example</b> button to see its code." : ""}</p>
    ${S.simDone ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px" id="exs">${SIM.map((x, i) => `<button class="st" style="border:0;cursor:pointer" onclick="simI=${i};simShow()">Example ${i + 1}</button>`).join("")}</div>` : ""}
    <div class="sim">
      <div>
        <p class="panel-t">Line of code</p>
        <div class="codeline" id="cl"></div>
        <p class="panel-t" style="margin-top:12px">Shell</p>
        <div class="shell" id="sh"></div>
      </div>
      <div>
        <p class="panel-t">What the computer does</p>
        ${flowHTML("flow")}
      </div>
    </div>
    <div class="msg info note" id="note">Click <b>▶ Run</b> to start.</div>
    <div class="dots" id="dots"></div>
    <button class="btn" id="run">▶ Run</button>
    <button class="btn alt hidden" id="nextEx">Next example ▶</button>
    <button class="btn ${S.simDone ? "" : "hidden"}" id="cont">${back ? "◀ Back to where I was" : "Continue ▶"}</button>
  </div>`;
  $("run").onclick = simRun;
  $("nextEx").onclick = () => { simI++; simShow(); };
  $("cont").onclick = () => back ? backFromSim() : go("missions");
  simShow();
}
function simShow(){
  simTok++; busy = false;
  const s = SIM[simI];
  document.querySelectorAll("#exs .st").forEach((b, i) => b.className = "st" + (i === simI ? " on" : ""));
  $("cl").innerHTML = colour(s.code);
  $("sh").innerHTML = "";
  $("note").innerHTML = `Example ${simI + 1} of ${SIM.length}. Click <b>▶ Run</b>.`;
  $("dots").innerHTML = SIM.map((x, i) => `<i class="${i <= simI ? "on" : ""}"></i>`).join("");
  flowSet("flow", -1, !!s.out);
  $("run").classList.remove("hidden"); $("run").disabled = false;
  $("nextEx").classList.add("hidden");
}
function simRun(){
  if(busy) return;
  busy = true; $("run").disabled = true;
  const tok = simTok;
  const s = SIM[simI], sh = $("sh");
  const live = () => tok === simTok && $("sh") === sh;   // stop if the student switched example or page
  sh.innerHTML = "";
  flowSet("flow", 0, !!s.out);
  $("note").innerHTML = "💬 <b>Step 1:</b> input() shows the question.";
  const line = shellLine(sh, `<span class="p">${esc(s.prompt)}</span><span class="ty"></span><span class="cursor">&nbsp;</span>`);
  setTimeout(() => {
    if(!live()) return;
    flowSet("flow", 1, !!s.out);
    $("note").innerHTML = "⌨️ <b>Step 2:</b> The program is <b>waiting</b>… the user types an answer and presses Enter.";
    let c = 0;
    setTimeout(function typeNext(){
      if(!live()) return;
      line.querySelector(".ty").textContent = s.typed.slice(0, ++c);
      if(c < s.typed.length) return setTimeout(typeNext, 230);
      setTimeout(() => {
        if(!live()) return;
        line.querySelector(".cursor").remove();
        if(s.out){
          flowSet("flow", 2, true);
          shellLine(sh, esc(s.out));
          setTimeout(finish, 300);   // finish() checks live() itself
        } else { flowSet("flow", 3, false); finish(); }
      }, 500);
    }, 900);
  }, 1300);
  function finish(){
    if(!live()) return;
    $("note").innerHTML = s.note;
    busy = false;
    $("run").classList.add("hidden");
    if(simI < SIM.length - 1){ $("nextEx").classList.remove("hidden"); }
    else {
      if(!S.simDone){ S.simDone = true; addPts(20); commit(); $("note").innerHTML += " <b>+20 points</b>"; }
      $("cont").classList.remove("hidden");
    }
  }
}

/* ================= TRY IT YOURSELF ================= */
const Q = `(["'])(.*?)\\1`;   // text in quotes
const MISSIONS = [
  { title: "Mission 1 – Ask a question",
    task: "Write <b>one line</b> of Python that asks the user: <b>What is your name?</b>",
    re: new RegExp(`^\\s*input\\s*\\(\\s*${Q}\\s*\\)\\s*$`),
    parse: m => ({ prompt: m[2], before: null, after: null }),
    hint: "Use the function that asks questions. The question goes inside the brackets, in quotes.",
    answer: 'input("What is your name? ")' },
  { title: "Mission 2 – Ask and print",
    task: "Write <b>one line</b> that asks <b>Which emirate do you live in?</b> and prints <b>I live in</b> with the answer.",
    re: new RegExp(`^\\s*print\\s*\\(\\s*(?:${Q}\\s*,\\s*)?input\\s*\\(\\s*(["'])(.*?)\\3\\s*\\)\\s*\\)\\s*$`),
    parse: m => ({ prompt: m[4], before: m[2] == null ? null : m[2], after: null }),
    hint: "Start with print( then the message in quotes, a comma, and then input() with the question.",
    answer: 'print("I live in", input("Which emirate do you live in? "))' },
  { title: "Mission 3 – What comes first?", predict: true }
];
function friendly(c, needPrint){
  if(/\bInput\s*\(|\bPrint\s*\(/.test(c)) return "Python is case-sensitive – write <b>input</b> and <b>print</b> with small letters.";
  if(!/input\s*\(/.test(c)) return "Use the <b>input()</b> function to ask the question.";
  if(needPrint && !/print\s*\(/.test(c)) return "Put input() inside <b>print()</b> so the answer is shown.";
  if((c.match(/\(/g) || []).length !== (c.match(/\)/g) || []).length) return "Check your brackets – every <b>(</b> needs a <b>)</b>.";
  if(!/["']/.test(c)) return "The question must be inside <b>quotes</b> \" \".";
  if(needPrint && !/,/.test(c)) return "Put a <b>comma</b> between the message and input().";
  return "Almost! Check your quotes, commas and brackets.";
}
function missions(){

  if(i >= MISSIONS.length) return go("levels");

      app.querySelectorAll(".opt").forEach(x => x.disabled = true);

    });
    return;
  }
  app.innerHTML = `
  <div class="card">
    <span class="tag">Try it yourself · ${i + 1} of 3</span>
    <h2>${M.title}</h2>
    <p>${M.task}</p>
    <div class="sim">
      <div>
        <p class="panel-t">Your line of code</p>
        <input type="text" id="code" class="mono" spellcheck="false" autocomplete="off" placeholder="type your line of Python here">
        <button class="btn" id="runm">▶ Run</button>
        <span class="hint" id="hb">💡 Show me the answer</span>${simLink()}<div id="hbox"></div>
        <p class="panel-t" style="margin-top:12px">Shell</p>
        <div class="shell" id="sh" style="min-height:90px"></div>
      </div>
      <div>
        <p class="panel-t">What the computer does</p>
        ${flowHTML("mflow")}
      </div>
    </div>
    <div id="m"></div>
  </div>`;
  flowSet("mflow", -1, i === 1);
  $("hb").onclick = () => {
    $("hbox").innerHTML = `<div class="msg info">💡 ${M.hint}<br>Type this line in the box, then click <b>▶ Run</b>:
      <pre style="margin:8px 0">${esc(M.answer)}</pre>
      <button class="btn alt" style="margin-top:0" id="fill">Put it in the box for me</button></div>`;
    $("hb").remove();
    $("fill").onclick = () => { $("code").value = M.answer; $("sh").innerHTML = ""; $("m").innerHTML = ""; $("code").focus(); };
  };
  $("code").onkeydown = e => { if(e.key === "Enter") $("runm").click(); };
  $("runm").onclick = () => {
    const c = $("code").value, sh = $("sh"), mm = M.re.exec(c);
    sh.innerHTML = ""; $("m").innerHTML = "";
    if(!mm || !mm[i === 0 ? 2 : 4].trim()){
      shellLine(sh, `<span class="err">Error – the program could not run</span>`);
      $("m").innerHTML = `<div class="msg bad">${mm ? "Write a question inside the quotes." : friendly(c, i === 1)}</div>`;

    const inp = document.createElement("input"); inp.type = "text"; inp.placeholder = "type & press Enter";
    line.appendChild(inp);

      else flowSet("mflow", 3, false);
      S.m++; addPts(10); commit();
      $("m").innerHTML = `<div class="msg ok">Mission complete! +10 points</div><button class="btn" onclick="missions()">Next mission ▶</button>`;
    };
  };
}

/* ================= PYTHON EDITOR + RUNNER (Skulpt) ================= */
function setupEditor(ed, gut, onChange){
  const lines = () => { gut.textContent = Array.from({ length: ed.value.split("\n").length }, (_, k) => k + 1).join("\n"); };
  ed.addEventListener("input", () => { lines(); onChange(); });
  ed.addEventListener("scroll", () => { gut.scrollTop = ed.scrollTop; });
  ed.addEventListener("keydown", e => {
    if(e.key === "Tab"){
      e.preventDefault();
      const s = ed.selectionStart;
      ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(ed.selectionEnd);
      ed.selectionStart = ed.selectionEnd = s + 4; lines(); onChange();
    }
  });
  lines();
}
let runToken = 0;
function friendlyError(err){
  let msg = String(err && err.toString ? err.toString() : err);
  let line = "";
  try{ if(err.traceback && err.traceback.length) line = " (line " + err.traceback[0].lineno + ")"; }catch(e){}
  msg = msg.replace(/ on line \d+/, "");
  let tip = "Read the error, fix your code and run it again.";
  if(/SyntaxError/.test(msg)) tip = "Check your <b>quotes \" \"</b>, <b>commas</b> and <b>brackets ( )</b> on this line.";
  const nm = msg.match(/NameError: name '(\w+)' is not defined/);
  if(nm) tip = /^[A-Z]/.test(nm[1]) ? `Python does not know <b>${esc(nm[1])}</b>. Use small letters – Python is case-sensitive.`
                                    : `Python does not know <b>${esc(nm[1])}</b>. Check the spelling, or put text inside quotes " ".`;
  if(/TypeError/.test(msg)) tip = "Check the brackets and commas inside print() and input().";
  return { text: msg + line, tip };
}
function runPython(code, sh){
  const token = ++runToken;
  sh.innerHTML = "";
  const r = { ok: false, error: "", code, prompts: [], answers: [], printed: [] };
  if(typeof Sk === "undefined"){
    shellLine(sh, `<span class="err">The Python editor could not load. Please check the internet connection and refresh the page.</span>`);
    return Promise.resolve(r);
  }
  let buf = "";
  const flushLine = t => { r.printed.push(t); shellLine(sh, esc(t) || "&nbsp;"); sh.scrollTop = sh.scrollHeight; };
  Sk.configure({
    __future__: Sk.python3,
    output: txt => {
      if(token !== runToken) return;
      buf += txt;
      let k;
      while((k = buf.indexOf("\n")) >= 0){ flushLine(buf.slice(0, k)); buf = buf.slice(k + 1); }
    },
    read: f => {
      if(Sk.builtinFiles === undefined || Sk.builtinFiles.files[f] === undefined) throw "File not found: '" + f + "'";
      return Sk.builtinFiles.files[f];
    },
    inputfunTakesPrompt: true,
    inputfun: prompt => new Promise(resolve => {
      if(token !== runToken) return;
      if(buf){ flushLine(buf); buf = ""; }
      const p = String(prompt == null ? "" : prompt);
      r.prompts.push(p);
      const line = shellLine(sh, `<span class="p">${esc(p)}</span>`);
      const inp = document.createElement("input"); inp.type = "text"; inp.placeholder = "type & press Enter";
      line.appendChild(inp); inp.focus(); sh.scrollTop = sh.scrollHeight;
      inp.onkeydown = e => {
        if(e.key !== "Enter" || !inp.value.trim()) return;
        const v = inp.value;
        line.innerHTML = `<span class="p">${esc(p)}</span>${esc(v)}`;
        r.answers.push(v.trim());
        resolve(v);
      };
    })
  });
  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, true))
    .then(() => {
      if(token !== runToken) return null;
      if(buf){ flushLine(buf); buf = ""; }
      r.ok = true;
      shellLine(sh, `<span class="ok-line">✔ Program finished</span>`);
      return r;
    })
    .catch(err => {
      if(token !== runToken) return null;
      if(buf){ flushLine(buf); buf = ""; }
      const f = friendlyError(err);
      r.error = f.text;
      shellLine(sh, `<span class="err">${esc(f.text)}</span>`);
      shellLine(sh, `<span style="color:#ffd27a">💡 ${f.tip}</span>`);
      return r;
    });
}

    ${!S.lv[3] ? `<p>While you wait, you can try the optional challenge:</p><button class="btn alt" id="l4">⭐ Try Level 4 (optional)</button>` : `<p>⭐ Level 4 completed! <a href="#" onclick="openLevel(3);return false">See Level 4</a></p>`}

/* ================= HOT + BADGE ================= */
function hot(){
  app.innerHTML = `
  <div class="card">
    <span class="tag">Plenary · HOT Question</span>
    <h2>Think deeper 🧠</h2>
    <p>${esc(HOT_Q)}</p>
    <textarea id="h" rows="5" placeholder="Type your answer here…"></textarea>
    <button class="btn" id="sub">Submit answer</button>
    <div id="m"></div>
  </div>`;
  $("sub").onclick = () => {
    const v = $("h").value.trim();
    if(!v){ $("m").innerHTML = `<div class="msg bad">Please type your answer before you submit.</div>`; return; }
    if(v.split(/\s+/).length < 3){ $("m").innerHTML = `<div class="msg bad">Your answer is very short. Please add a few more words to explain your thinking.</div>`; return; }
    S.hot = v; addPts(10); go("done");
  };
}
function done(){
  const master = S.lv[3];
  app.innerHTML = `
  <div class="card center">
    <div class="badge">${master ? "🏆" : "🥇"}</div>
    <h2>${master ? "Input Master" : "Input Explorer"}</h2>
    <p><b>${esc(S.name)}</b> (${esc(S.cls)}-${esc(S.div)}) – <b>${S.points} points</b></p>
    <p style="color:var(--muted)">${master ? "You completed all 4 levels. Outstanding!" : "You completed Levels 1–3. Great work!"}</p>
    <button class="btn alt" onclick="signOut()">Sign out</button>
  </div>`;
}
